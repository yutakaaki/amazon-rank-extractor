name: 本日発売コミック抽出

on:
  # 定時取得は自宅Mac(launchd 5:58/17:58)が担当する。
  # GitHubのcronは2〜7時間遅延して深夜に空振りするため使わない。
  # ここは「Macが閉じていた日に、iPad等から手動で取り直す」ための経路。
  workflow_dispatch:
    inputs:
      tag:
        description: '0600 か 1800 (空なら実行時刻から自動判定)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: extract
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo # 朝/夕の判定と日付をJSTで行う
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存インストール
        run: npm ci || npm install

      - name: Chromium 準備
        run: npx playwright install --with-deps chromium

      # どのcronで起動したかからタグを決める。
      # 実行時刻から推測すると、遅延した夕方の回が「翌日の朝」と誤認されるため。
      - name: 抽出実行
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            case "$SCHEDULE" in
              "12 21 * * *") TAG=0600 ;;
              "12 9 * * *")  TAG=1800 ;;
            esac
          fi
          echo "実行タグ: ${TAG:-(時刻から自動判定)}"
          node src/daily.js $TAG

      # 通常は daily.js 側が push 済み。失敗した場合の保険として残す。
      - name: 結果をコミット(保険)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results snapshots docs
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "auto: $(date '+%F %H:%M') 抽出結果"
            git pull --rebase --autostash || true
            git push
          fi

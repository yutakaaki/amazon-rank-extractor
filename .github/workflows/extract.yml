name: 本日発売コミック抽出

on:
  # 定時取得は自宅Mac(launchd 5:58/17:58)が担当する。
  # GitHubのcronは2〜7時間遅延して深夜に空振りするため使わない。
  # ここは「Macが閉じていた日に、iPad等から手動で取り直す」ための経路。
  workflow_dispatch:
    inputs:
      tag:
        description: '0600 か 1800 (空なら実行時刻から自動判定)'
        required: false
        default: ''
      debug:
        description: 'true にすると検索ページの状態だけ調べて終了'
        required: false
        default: ''
  # iPad等ではGitHubのモバイル画面に「Run workflow」が出ないことがあるため、
  # Issueを立てるだけでも実行できるようにする。
  # タイトルに 0600 / 1800 を含めるとその回として実行する。
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: extract
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo # 朝/夕の判定と日付をJSTで行う
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存インストール
        run: npm ci || npm install

      - name: Chromium 準備
        run: npx playwright install --with-deps chromium

      # クラウドからAmazonの検索が見えているかを調べる(debug=true のときだけ)
      - name: 検索ページの診断
        if: github.event.inputs.debug == 'true'
        run: node scripts/diagnose-search.mjs

      # どのcronで起動したかからタグを決める。
      # 実行時刻から推測すると、遅延した夕方の回が「翌日の朝」と誤認されるため。
      - name: 抽出実行
        if: github.event.inputs.debug != 'true'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          TAG="$INPUT_TAG"
          # Issue起動の場合はタイトルから 0600/1800 を読む
          if [ -z "$TAG" ] && [ -n "$ISSUE_TITLE" ]; then
            case "$ISSUE_TITLE" in
              *0600*) TAG=0600 ;;
              *1800*) TAG=1800 ;;
            esac
          fi
          if [ -z "$TAG" ]; then
            case "$SCHEDULE" in
              "12 21 * * *") TAG=0600 ;;
              "12 9 * * *")  TAG=1800 ;;
            esac
          fi
          echo "実行タグ: ${TAG:-(時刻から自動判定)}"
          node src/daily.js $TAG

      # 通常は daily.js 側が push 済み。失敗した場合の保険として残す。
      - name: 結果をコミット(保険)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results snapshots docs
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "auto: $(date '+%F %H:%M') 抽出結果"
            git pull --rebase --autostash || true
            git push
          fi

      # Issueから起動した場合は、完了報告してIssueを閉じる(溜まらないように)
      - name: Issueを閉じる
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "実行しました（結果: ${{ job.status }}）。数分後に公開ページへ反映されます。
          https://yutakaaki.github.io/amazon-rank-extractor/"
          gh issue close "${{ github.event.issue.number }}"
